# Local production-parity overlay (D3.19).
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml up -d --build

services:
  minio-init:
    image: minio/mc:latest
    container_name: gmrlog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-gmrlog} $${MINIO_ROOT_PASSWORD:-gmrlogsecret};
      mc mb -p local/gmrlog || true;
      mc anonymous set download local/gmrlog || true;
      exit 0;
      "
    networks:
      - gmrlog-network

  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: gmrlog-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_DOCS_ENABLED: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmrlog}:${POSTGRES_PASSWORD:-gmrlog}@postgres:5432/${POSTGRES_DB:-gmrlog}?schema=public&connection_limit=10&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gmrlog}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gmrlogsecret}
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/gmrlog/}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-gmrlog-dev-master-key}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: gmrlog-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.main.js']
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmrlog}:${POSTGRES_PASSWORD:-gmrlog}@postgres:5432/${POSTGRES_DB:-gmrlog}?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gmrlog}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gmrlogsecret}
      S3_FORCE_PATH_STYLE: 'true'
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-gmrlog-dev-master-key}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gmrlog-network

  nginx:
    image: nginx:1.27-alpine
    container_name: gmrlog-nginx
    restart: unless-stopped
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gmrlog-network
