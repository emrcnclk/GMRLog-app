# Local production-parity overlay (D3.19).
# Usage:
#   pnpm docker:prod:up
# which preflights `infrastructure/docker/.env.production.local` (gitignored,
# yours to fill in) before handing it to compose. Never point this stack at
# `.env.production.example` — those values are placeholders, not secrets.
#
# Bug 4 — the base compose publishes every backing service on 0.0.0.0, which is
# fine for a dev laptop and wrong for anything production-shaped: Postgres,
# Redis, MinIO, Meilisearch, Mailpit and a *passwordless* pgAdmin were all
# reachable from any host that could route to the box. The overrides below take
# the datastores off the host entirely — the API reaches them over
# `gmrlog-network`, so nothing is lost — and bind the two that a human genuinely
# needs to 127.0.0.1.
services:
  postgres:
    # No host port: nothing outside the compose network has any business
    # speaking to the database directly.
    ports: !reset null

  redis:
    ports: !reset null

  meilisearch:
    ports: !reset null
    environment:
      # The base sets `development`, which lets Meilisearch run without a real
      # master key. Production mode requires one of at least 16 bytes.
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?set MEILI_API_KEY}

  minio:
    # Loopback only, and the admin console is not published at all. The API port
    # stays reachable from the host because `MEDIA_PUBLIC_BASE_URL` hands media
    # URLs to the browser; a real deployment fronts this with nginx instead.
    ports: !override
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  mailpit:
    # SMTP is reached over the compose network by name, so only the web UI is
    # published, and only to loopback.
    ports: !override
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  pgadmin:
    # Not part of this stack. The base runs it with
    # `PGADMIN_CONFIG_SERVER_MODE: 'False'`, i.e. an unauthenticated database
    # console — putting it behind a profile keeps `pnpm docker:prod:up` from
    # starting it while leaving `pnpm docker:up` unchanged for development.
    # Note this cannot stop a pgAdmin already started by a dev `docker:up`;
    # run `pnpm docker:down` first if that stack is up.
    profiles:
      - tools
    ports: !reset null

  minio-init:
    image: minio/mc:latest
    container_name: gmrlog-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-gmrlog} $${MINIO_ROOT_PASSWORD:-gmrlogsecret};
      mc mb -p local/gmrlog || true;
      mc anonymous set download local/gmrlog || true;
      exit 0;
      "
    networks:
      - gmrlog-network

  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: gmrlog-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_DOCS_ENABLED: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmrlog}:${POSTGRES_PASSWORD:-gmrlog}@postgres:5432/${POSTGRES_DB:-gmrlog}?schema=public&connection_limit=10&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gmrlog}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gmrlogsecret}
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/gmrlog/}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-gmrlog-dev-master-key}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:?set STEAM_WEB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: gmrlog-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.main.js']
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmrlog}:${POSTGRES_PASSWORD:-gmrlog}@postgres:5432/${POSTGRES_DB:-gmrlog}?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gmrlog}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gmrlogsecret}
      S3_FORCE_PATH_STYLE: 'true'
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY:-gmrlog-dev-master-key}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gmrlog-network

  nginx:
    image: nginx:1.27-alpine
    container_name: gmrlog-nginx
    restart: unless-stopped
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gmrlog-network
