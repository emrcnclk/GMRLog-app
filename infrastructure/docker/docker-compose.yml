services:
  postgres:
    image: postgres:17-alpine
    container_name: gmrlog-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmrlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmrlog}
      POSTGRES_DB: ${POSTGRES_DB:-gmrlog}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_MESSAGES: C
    command:
      - postgres
      - -c
      - lc_messages=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gmrlog-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: gmrlog-minio
    restart: unless-stopped
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gmrlog}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gmrlogsecret}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: gmrlog-mailpit
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: gmrlog-meilisearch
    restart: unless-stopped
    ports:
      - '${MEILI_PORT:-7700}:7700'
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_API_KEY:-gmrlog-dev-master-key}
    volumes:
      - meili_data:/meili_data
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gmrlog-pgadmin
    restart: unless-stopped
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gmrlog.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - gmrlog-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:80/misc/ping']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  gmrlog-network:
    name: gmrlog-network
    driver: bridge

volumes:
  postgres_data:
    name: gmrlog_postgres_data
  redis_data:
    name: gmrlog_redis_data
  minio_data:
    name: gmrlog_minio_data
  meili_data:
    name: gmrlog_meili_data
  pgadmin_data:
    name: gmrlog_pgadmin_data
