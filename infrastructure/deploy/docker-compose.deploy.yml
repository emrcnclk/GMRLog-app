# GMRLOG — remote production stack.
#
# This file is standalone on purpose. `infrastructure/docker/docker-compose.yml`
# (+ its `.prod.yml` overlay) is a *local* production-parity stack: it builds the
# image from a checkout, publishes ports for a developer, and terminates TLS with
# a self-signed cert. A real host has none of those needs — it pulls a published
# image, exposes nothing but 80/443, and terminates TLS with a Let's Encrypt
# certificate. Extending the dev file would have dragged Mailpit, pgAdmin and a
# build context onto the server, so the deploy stack is written out in full.
#
# Usage on the server (see docs/10_DEVOPS/PRODUCTION_DEPLOYMENT.md):
#   ./scripts/init-letsencrypt.sh    # once, to issue the first certificate
#   ./scripts/deploy.sh v1.0.0       # every release
#
# Everything is read from `.env.deploy.local`, which never exists in git.

# Pinned rather than derived from the directory name: the project name prefixes
# every network and default volume, so a host that keeps this at
# /opt/gmrlog/deploy would otherwise run a project literally called "deploy".
name: gmrlog

services:
  postgres:
    image: postgres:17-alpine
    container_name: gmrlog-postgres
    restart: unless-stopped
    # No host port. The API reaches Postgres over `gmrlog-network`; nothing
    # outside the compose network has any business speaking to it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_MESSAGES: C
    command:
      - postgres
      - -c
      - lc_messages=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [gmrlog-network]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: gmrlog-redis
    restart: unless-stopped
    # AOF with per-second fsync, plus the RDB snapshot points `BGSAVE` and
    # scripts/backup-redis.sh rely on. Redis here is not a pure cache: BullMQ
    # keeps job state in it, so losing it loses queued work.
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --save 900 1 --save 300 10 --save 60 10000
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks: [gmrlog-network]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: gmrlog-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?set MEILI_API_KEY}
    volumes:
      - meili_data:/meili_data
    networks: [gmrlog-network]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: gmrlog-minio
    restart: unless-stopped
    # Not published. Media is served to browsers through nginx at
    # https://<domain>/media/, which is what MEDIA_PUBLIC_BASE_URL points at.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    networks: [gmrlog-network]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: gmrlog-minio-init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET} || true;
      mc anonymous set download local/$${S3_BUCKET} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
    networks: [gmrlog-network]

  # One-shot, and the API waits on it completing successfully. Migrations are
  # forward-only: `deploy.sh` can roll the *image* back, it cannot roll a
  # migration back, which is why an additive-only migration policy is a release
  # requirement here rather than a style preference.
  migrate:
    image: ${GMRLOG_IMAGE:?set GMRLOG_IMAGE}:${GMRLOG_IMAGE_TAG:?set GMRLOG_IMAGE_TAG}
    container_name: gmrlog-migrate
    restart: 'no'
    # The prisma binary directly, not `pnpm --filter ... exec prisma`. The
    # runtime image only runs `corepack enable`, which installs shims — the
    # first `pnpm` invocation would try to *download* pnpm@9.15.9 from the npm
    # registry, so a migration would depend on the production host's outbound
    # network and on a corepack prompt that has no TTY to answer it. The repo
    # sets `node-linker=hoisted` (.npmrc), so the CLI is at the root .bin.
    working_dir: /app/packages/database
    command: ['/app/node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5&pool_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gmrlog-network]

  api:
    image: ${GMRLOG_IMAGE:?set GMRLOG_IMAGE}:${GMRLOG_IMAGE_TAG:?set GMRLOG_IMAGE_TAG}
    container_name: gmrlog-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${GMRLOG_IMAGE_TAG}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_DOCS_ENABLED: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=10&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN}/media/
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:?set PASSWORD_RESET_URL_BASE}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:?set STEAM_WEB_API_KEY}
      STEAM_OPENID_REALM: ${STEAM_OPENID_REALM:-}
      STEAM_OPENID_ALLOWED_RETURN_URIS: ${STEAM_OPENID_ALLOWED_RETURN_URIS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${GMRLOG_IMAGE_TAG}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [gmrlog-network]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${GMRLOG_IMAGE:?set GMRLOG_IMAGE}:${GMRLOG_IMAGE_TAG:?set GMRLOG_IMAGE_TAG}
    container_name: gmrlog-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.main.js']
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${GMRLOG_IMAGE_TAG}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=5&pool_timeout=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: https://${API_DOMAIN}/media/
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${GMRLOG_IMAGE_TAG}
    depends_on:
      api:
        condition: service_healthy
    networks: [gmrlog-network]

  nginx:
    image: nginx:1.27-alpine
    container_name: gmrlog-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-gmrlog}
      # nginx's entrypoint runs envsubst over /etc/nginx/templates/*.template.
      # Without this filter it would also substitute nginx's own runtime
      # variables ($host, $remote_addr, $request_id) with empty strings.
      NGINX_ENVSUBST_FILTER: '(API_DOMAIN|S3_BUCKET)'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/gmrlog-proxy.inc:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # nginx reads a certificate once, at start or reload, so a renewed cert is
    # invisible to a long-running container until something tells it to reload.
    # The certbot container cannot signal across the container boundary without
    # a Docker socket, which is not worth mounting for this, so nginx reloads
    # itself on a timer instead.
    #
    # The re-entrant `/docker-entrypoint.sh nginx` is deliberate, not
    # accidental: the image's entrypoint only runs its template/envsubst step
    # when its first argument is literally `nginx`. Overriding `command` with a
    # shell would silently skip envsubst and leave ${API_DOMAIN} unsubstituted,
    # so the shell hands the real argv back to the entrypoint.
    command:
      - /bin/sh
      - -c
      - |
        ( while :; do sleep 6h; nginx -s reload 2>/dev/null || true; done ) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    networks: [gmrlog-network]
    healthcheck:
      # 127.0.0.1, not localhost: the base image ships /etc/nginx/conf.d/
      # default.conf with `server_name localhost`, which would win the host
      # match and answer this probe with its own 404 instead of reaching the
      # server block below.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Renewal only. The *first* certificate is issued by
  # scripts/init-letsencrypt.sh, which has to bootstrap around nginx refusing to
  # start without a certificate file on disk.
  certbot:
    image: certbot/certbot:latest
    container_name: gmrlog-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Certbot renews inside the last 30 days of a 90-day certificate, so a
    # twice-daily check is the documented cadence, not an arbitrary one.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  gmrlog-network:
    name: gmrlog-network
    driver: bridge

volumes:
  postgres_data:
    name: gmrlog_postgres_data
  redis_data:
    name: gmrlog_redis_data
  minio_data:
    name: gmrlog_minio_data
  meili_data:
    name: gmrlog_meili_data
  certbot_certs:
    name: gmrlog_certbot_certs
  certbot_webroot:
    name: gmrlog_certbot_webroot
