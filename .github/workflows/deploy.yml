name: Deploy

# Releases are cut by tag. `ci.yml` runs on pushes to main/develop and on PRs
# into them — it does not run on tag pushes, so this workflow does not assume a
# green tick appeared by magic: the `guard` job below checks that the tagged
# commit is on main and that CI actually passed for that exact SHA.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to (re)deploy, e.g. v1.0.0. Leave empty to build from the current ref.'
        required: false
        type: string

concurrency:
  # Never two deploys onto one host at once, and never cancel one midway —
  # a cancelled deploy leaves migrations applied and containers half-rolled.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  guard:
    name: Verify the commit is releasable
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: resolve
        env:
          # Through env, not inlined into the script: a `${{ }}` expansion is
          # pasted into the shell before it runs, so a dispatch input containing
          # shell syntax would execute here.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Refusing to deploy tag '$TAG' — release tags look like v1.2.3."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: The tagged commit must be on main
        run: |
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main — refusing to deploy a commit that never landed."
            exit 1
          fi

      - name: CI must have passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push does not run ci.yml. What must exist is a successful CI
          # run for the same SHA from when it landed on main. Absent that, this
          # would deploy code whose tests were never run on this commit.
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "missing"')
          echo "CI conclusion for ${GITHUB_SHA}: ${CONCLUSION}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Refusing to deploy: CI has no successful completed run for this commit."
            exit 1
          fi

  image:
    name: Build and push the image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.guard.outputs.tag }}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The backend image is built once here and deployed as-is. Building it
          # again on the server would make "what is running" a function of the
          # server's disk state rather than of this commit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [guard, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A GitHub Environment named `production`. Configure a required reviewer on
    # it if a release should pause for a human; leave it unprotected for
    # push-to-deploy. Either way the deploy secrets live on the environment, not
    # on the repository, so a workflow on a fork branch cannot read them.
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys, not StrictHostKeyChecking=no: without this the
          # first connection trusts whatever answers, which is the whole
          # man-in-the-middle window. Generate with:
          #   ssh-keyscan -H <host>
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync the deploy directory to the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Compose file, nginx templates and the operational scripts only.
          # --exclude on the env file and state is load-bearing: those are
          # written on the host and must never be overwritten from the repo.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude '.env.deploy.local' \
            --exclude '.deployed-tag' \
            --exclude 'backups/' \
            --exclude 'scripts/deploy/' \
            infrastructure/deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            scripts/deploy/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/deploy/"

      - name: Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST")

          # The token goes over stdin, never into the remote command line —
          # anything in argv is readable in the host's process list by any other
          # user on the box for as long as the command runs.
          printf '%s' "$REGISTRY_TOKEN" \
            | "${SSH[@]}" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          # The preflight runs in a container so the host needs Docker and
          # nothing else — no Node install to keep patched on a box whose only
          # job is running containers.
          "${SSH[@]}" "cd '$DEPLOY_PATH' \
             && chmod +x scripts/*.sh \
             && docker run --rm -v \"\$PWD\":/w -w /w node:22-alpine \
                  node scripts/deploy/preflight-deploy-env.mjs .env.deploy.local \
             && ./scripts/deploy.sh '$RELEASE_TAG'"

      - name: Smoke the public endpoint
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          # Through the real hostname and the real certificate, not through the
          # tunnel above: this is the only step that proves TLS, DNS and the
          # nginx edge are all correct, which the in-container readiness gate in
          # deploy.sh cannot see.
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://${API_DOMAIN}/api/v1/health/ready" > ready.json; then
              cat ready.json
              exit 0
            fi
            sleep 6
          done
          echo "Public readiness probe never succeeded for https://${API_DOMAIN}"
          exit 1

      - name: Revoke the registry login on the host
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker logout ghcr.io' || true
