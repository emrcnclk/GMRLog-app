name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 10.1's Redis-race fix and the backend's integration specs both run
    # against a real Postgres/Redis, not mocks — a mocked Redis would not
    # have caught the bug 10.1 fixed. Native GH Actions services, matching
    # the ports env.schema.ts already defaults to (localhost:5432 / :6379).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gmrlog
          POSTGRES_PASSWORD: gmrlog
          POSTGRES_DB: gmrlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmrlog -d gmrlog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # APP_ENV is deliberately left unset (schema default 'development'):
      # packages/config's z.enum for APP_ENV only accepts
      # development/staging/production, not 'test' — NODE_ENV: test already
      # carries the test signal and IS in that enum.
      NODE_ENV: test
      LOG_LEVEL: error
      DATABASE_URL: postgresql://gmrlog:gmrlog@localhost:5432/gmrlog?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Backend/database tests run against the real schema (D3.19/D3.20
      # defaults point at this same service), so the migrations must be
      # applied before the graph below can pass.
      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # One command, uncached (--force), covering the whole graph — not the
      # filtered `--filter` runs that undercounted in 9.3/9.5e. The count is
      # asserted below so a filtered or misconfigured run fails loudly
      # instead of reporting a plausible-looking green.
      - name: Run full graph (typecheck, lint, test, build)
        run: |
          set -o pipefail
          pnpm turbo run typecheck lint test build --force --continue 2>&1 | tee turbo-run.log

      - name: Assert the full task graph ran
        run: |
          # 33 is the known-good count (8 packages x {typecheck,lint,test,build}
          # + @gmrlog/database's prisma `generate`), confirmed by 10.1's own run.
          # Update this constant deliberately in the same PR that adds or removes
          # a package/task — an unexplained change here means the graph shrank
          # (a filtered/misconfigured run) or grew unnoticed, not a passing build.
          EXPECTED_TASK_COUNT=33
          SUMMARY_LINE=$(grep -E "Tasks:[[:space:]]+[0-9]+ successful" turbo-run.log | tail -1)
          if [ -z "$SUMMARY_LINE" ]; then
            echo "No turbo task summary line found in output — treating as failure."
            exit 1
          fi
          echo "$SUMMARY_LINE"
          SUCCESSFUL=$(echo "$SUMMARY_LINE" | grep -oE "Tasks:[[:space:]]+[0-9]+" | grep -oE "[0-9]+")
          TOTAL=$(echo "$SUMMARY_LINE" | grep -oE "[0-9]+ total" | grep -oE "[0-9]+")
          if [ "$SUCCESSFUL" != "$TOTAL" ]; then
            echo "$TOTAL tasks ran but only $SUCCESSFUL succeeded."
            exit 1
          fi
          if [ "$TOTAL" != "$EXPECTED_TASK_COUNT" ]; then
            echo "Expected exactly $EXPECTED_TASK_COUNT tasks, turbo ran $TOTAL."
            echo "If a package/task was deliberately added or removed, update EXPECTED_TASK_COUNT in this step."
            exit 1
          fi

      # Migration replay from scratch, not a diff against the already-applied
      # dev database: 9.1 found a migration marked applied whose last statement
      # never ran, and 9.5b found a setval that only failed on an empty DB —
      # both invisible to a diff against a live database, both caught by
      # `prisma migrate dev` against a fresh one. Self-contained (embedded
      # PostgreSQL), independent of the service container above.
      - name: Migration replay check (real PostgreSQL, from empty)
        run: pnpm db:validate:pg

  # 10.4 — E2E over the five critical paths (sign up, sign in, log a game,
  # view a profile, send a message), against the real backend and the real
  # RNW web build, not the unit-test graph above. Deliberately NOT a turbo
  # task and NOT folded into `quality`'s task-count assertion: Playwright
  # drives a live server pair rather than turbo's cacheable, isolated task
  # graph, and folding it in would either inflate EXPECTED_TASK_COUNT for a
  # non-turbo run or silently exempt E2E from ever failing the build.
  e2e:
    name: E2E (critical paths)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gmrlog
          POSTGRES_PASSWORD: gmrlog
          POSTGRES_DB: gmrlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gmrlog -d gmrlog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No NODE_ENV here at all, anywhere in this job, on purpose. pnpm itself
    # reads NODE_ENV during `install` and skips devDependencies (turbo,
    # Playwright, eslint, husky's own `prepare` script) when it's
    # `production` — broke `Install dependencies` outright on the first real
    # run of this job. Left unset for the backend boot too, for the separate
    # reason explained on the "Start the backend" step below.
    env:
      LOG_LEVEL: error
      DATABASE_URL: postgresql://gmrlog:gmrlog@localhost:5432/gmrlog?schema=public
      REDIS_URL: redis://localhost:6379
      # env.schema.ts's own default is only http://localhost:3000. This
      # machine's local .env (untracked, per-machine) already carries 8081
      # for exactly this reason, which is why local runs never hit this and
      # every real run on this runner did: the frontend web build serves on
      # 8081, and without it in the allowlist the browser's CORS preflight on
      # every mutating request (POST /sessions, /sessions/register, /reviews,
      # /conversations, .../messages) never lets the real request through —
      # which the app's own probeApiReachability() then reads as "offline",
      # the banner every failing spec's page snapshot showed.
      CORS_ORIGINS: http://localhost:8081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      # Every workspace package here ships from `dist` (types, validators,
      # api-sdk, config, ui, database — same trap CLAUDE.md's "Known
      # environment traps" already names for @gmrlog/database locally), so
      # both the backend and the web bundle need their real deps built, not
      # picked up from source. The leading "..." in --filter=...pkg means
      # "this package plus everything it depends on" (turbo's own syntax for
      # walking upstream), so this builds both apps' full dependency chains.
      - name: Build the backend and frontend, and everything they depend on
        run: pnpm turbo run build --filter=...@gmrlog/backend --filter=...@gmrlog/frontend

      # The log-a-game flow needs one real game to exist. Local dev DBs carry
      # ~100k real rows (9.5b's backfill); this fresh, just-migrated CI
      # Postgres has none — there's no seed script anywhere in this repo, the
      # catalog is normally populated by the IGDB/Steam ingestion pipeline.
      # Idempotent upsert by slug; found missing on this job's first real run.
      - name: Ensure a game exists for the log-a-game flow
        run: pnpm --filter @gmrlog/database run fixture:e2e-game

      - name: Install Playwright's browser
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps chromium

      # NODE_ENV is left unset here too (schema default 'development') —
      # `production` triggers `assertProductionRequiredKeys` (env.schema.ts),
      # which fail-closes at boot unless JWT_SECRET/S3_*/SMTP_HOST/MEILI_HOST
      # are all explicitly supplied. This job isn't standing up a production
      # deployment, just booting the compiled server for E2E to talk to, so
      # it takes the same dev-default JWT secret and MinIO/Mailpit/Meilisearch
      # placeholders local `pnpm run dev` already relies on.
      - name: Start the backend
        working-directory: apps/backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend never became healthy:"
          cat backend.log
          exit 1

      # Playwright's own `webServer` config starts and supervises the
      # frontend web build (apps/frontend/e2e/playwright.config.ts).
      - name: Run the E2E suite
        working-directory: apps/frontend
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
