        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
  /conversations/{conversationId}/messages:

    get:

      tags:
        - Messages

      summary: List messages

      operationId: listMessages

      description: |
        Cursor page, newest first. Soft-deleted messages omitted unless `includeDeleted` (moderator).

      x-rate-limit: 180/min

      x-gmrlog-sprint: '9.1'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

        - $ref: './common/parameters.yaml#/components/parameters/Cursor'

        - $ref: './common/parameters.yaml#/components/parameters/Limit'

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessagePage'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

    post:

      tags:
        - Messages

      summary: Send message

      operationId: sendMessage

      description: |
        Requires write permission (active participant; not blocked).
        
        Sprint **9.1**: `messageType` MUST be `TEXT` only. `SYSTEM` is server-emitted. Rich card types and media types are non-normative until later sprints (see MessageType description).
        
        Idempotency-Key header recommended.

      x-rate-limit: 120/min

      x-gmrlog-sprint: '9.1'

      x-idempotent: true

      parameters:

        - $ref: '#/components/parameters/ConversationId'

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/CreateMessageRequest'

      responses:

        "201":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Message'

        "400":

          $ref: './common/responses.yaml#/components/responses/ValidationError'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
  /conversations/{conversationId}/messages/search:

    get:

      tags:
        - Messages

      summary: Search messages in conversation

      operationId: searchConversationMessages

      x-gmrlog-status: future

      x-gmrlog-sprint: '9.6'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

        - $ref: './common/parameters.yaml#/components/parameters/Cursor'

        - $ref: './common/parameters.yaml#/components/parameters/Limit'

        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/MessagePage'

        "400":

          $ref: './common/responses.yaml#/components/responses/ValidationError'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
