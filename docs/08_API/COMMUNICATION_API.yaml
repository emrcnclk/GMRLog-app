        name:

          type: string

          minLength: 2

          maxLength: 80

        description:

          type: string

          maxLength: 2000

        visibility:

          $ref: '#/components/schemas/GroupVisibility'

        tags:

          type: array

          items:

            type: string

      x-gmrlog-status: future

    UpdateGroupRequest:

