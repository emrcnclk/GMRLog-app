  ################################################################################

components:

  securitySchemes:

    BearerAuth:

      $ref: './common/security.yaml#/components/securitySchemes/BearerAuth'

  parameters:

    ConversationId:

      name: conversationId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    MessageId:

      name: messageId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    GroupId:

      name: groupId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    ChannelId:

      name: channelId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    UserId:

      name: userId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    ReactionId:

      name: reactionId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    PollId:

      name: pollId

      in: path

      required: true

      schema:

        type: string

        format: uuid

  schemas:

    ConversationType:

      type: string

      enum: [DIRECT, GROUP]

    MessageType:

      type: string

      description: |
        Full platform vocabulary (bible + future appendix).

        **Database Freeze values (shippable when attachment/media paths exist):**
        TEXT, IMAGE, GIF, VIDEO, GAME_SHARE, SYSTEM.

        **Sprint 9.1 normative write set:** TEXT only (`SYSTEM` is server-emitted).
        Clients MUST NOT send Freeze media/share types or rich-card types in 9.1.

        **Rich / future cards (non-normative until engagement/share sprints):**
        GAME_CARD, REVIEW_SHARE, COLLECTION_SHARE, LIST_SHARE, TIERLIST_SHARE,
        GAME_LOG_SHARE, ACHIEVEMENT_SHARE, DEVELOPER_POST, BROWSER_GAME, POLL, MEDIA.

        Rich cards reference foreign aggregate ids only — Communication never owns
        Review/List/Collection/TierList domain logic.
      enum:
        - TEXT
        - IMAGE
        - GIF
        - VIDEO
        - GAME_SHARE
        - SYSTEM
        - GAME_CARD
        - REVIEW_SHARE
        - COLLECTION_SHARE
        - LIST_SHARE
        - TIERLIST_SHARE
        - GAME_LOG_SHARE
        - ACHIEVEMENT_SHARE
        - DEVELOPER_POST
        - BROWSER_GAME
        - POLL
        - MEDIA
      x-gmrlog-sprint-9-1-write: [TEXT]

    GroupVisibility:

      type: string

      enum: [PUBLIC, PRIVATE, INVITE_ONLY, HIDDEN]

      x-gmrlog-status: future

    GroupMemberRole:

      type: string

      enum: [OWNER, MODERATOR, MEMBER]

      x-gmrlog-status: future

    ChannelKind:

      type: string

      enum: [GENERAL, ANNOUNCEMENTS, MEDIA, STRATEGY, LFG, VOICE]

      x-gmrlog-status: future

    Conversation:

      type: object

      required: [id, type, createdAt, updatedAt, participants]

      properties:

        id:

          type: string

          format: uuid

        type:

          $ref: '#/components/schemas/ConversationType'

        title:

          type: string

          nullable: true

          maxLength: 120

        groupId:

          type: string

          format: uuid

          nullable: true

          x-gmrlog-status: future

        channelId:

          type: string

          format: uuid

          nullable: true

          x-gmrlog-status: future

        participants:

          type: array

          items:

            $ref: '#/components/schemas/ConversationParticipant'

        lastMessage:

          allOf:

            - $ref: '#/components/schemas/Message'

          nullable: true

        unreadCount:

          type: integer

          minimum: 0

        archived:

          type: boolean

          default: false

        muted:

          type: boolean

          default: false

        createdAt:

          type: string

          format: date-time

        updatedAt:

          type: string

          format: date-time

    ConversationPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/Conversation'

    ConversationParticipant:

      type: object

      required: [userId, joinedAt]

      properties:

        userId:

          type: string

          format: uuid

        user:

          $ref: './common/schemas/user-summary.yaml#/components/schemas/UserSummary'

        joinedAt:

          type: string

          format: date-time

        leftAt:

          type: string

          format: date-time

          nullable: true

        lastReadAt:

          type: string

          format: date-time

          nullable: true

    ConversationParticipantPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/ConversationParticipant'

    CreateConversationRequest:

      type: object

      required: [participantIds]

      properties:

        participantIds:

          type: array

          minItems: 1

          maxItems: 1

          description: Other user id for DIRECT (caller implied).

          items:

            type: string

            format: uuid

        title:

          type: string

          maxLength: 120

        initialMessage:

          $ref: '#/components/schemas/CreateMessageRequest'

      example:

        participantIds:
          - "11111111-1111-4111-8111-111111111111"

        initialMessage:

          body: "Hey — want to co-op tonight?"

          messageType: TEXT

    UpdateConversationRequest:

      type: object

      properties:

        title:

          type: string

          maxLength: 120

          nullable: true

        archived:

          type: boolean

        muted:

          type: boolean

    AddParticipantRequest:

      type: object

      required: [userId]

      properties:

        userId:

          type: string

          format: uuid

      x-gmrlog-status: future

    Message:

      type: object

      required: [id, conversationId, senderId, messageType, createdAt, updatedAt]

      properties:

        id:

          type: string

          format: uuid

        conversationId:

          type: string

          format: uuid

        senderId:

          type: string

          format: uuid

        sender:

          $ref: './common/schemas/user-summary.yaml#/components/schemas/UserSummary'

        messageType:

          $ref: '#/components/schemas/MessageType'

        body:

          type: string

          nullable: true

          maxLength: 8000

        parentMessageId:

          type: string

          format: uuid

          nullable: true

          x-gmrlog-status: future

        richPayload:

          type: object

          additionalProperties: true

          nullable: true

          description: Typed card payload for share message types (gameId, reviewId, …).

        likeCount:

          type: integer

          minimum: 0

          default: 0

        reactionCount:

          type: integer

          minimum: 0

          default: 0

        replyCount:

          type: integer

          minimum: 0

          default: 0

        pinned:

          type: boolean

          default: false

        edited:

          type: boolean

          default: false

        deletedAt:

          type: string

          format: date-time

          nullable: true

        createdAt:

          type: string

          format: date-time

        updatedAt:

          type: string

          format: date-time

      example:

        id: "22222222-2222-4222-8222-222222222222"

        conversationId: "33333333-3333-4333-8333-333333333333"

        senderId: "11111111-1111-4111-8111-111111111111"

        messageType: TEXT

        body: "gg"

        likeCount: 0

        reactionCount: 0

        replyCount: 0

        pinned: false

        edited: false

        deletedAt: null

        createdAt: "2026-07-18T01:00:00.000Z"

        updatedAt: "2026-07-18T01:00:00.000Z"

    MessagePage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/Message'

    CreateMessageRequest:

      type: object

      properties:

        body:

          type: string

          maxLength: 8000

        messageType:

          $ref: '#/components/schemas/MessageType'

          default: TEXT

          description: |
            Sprint 9.1 writes: TEXT only. Other enum values are rejected with 400
            until their sprint enables them.

        richPayload:

          type: object

          additionalProperties: true

          description: |
            Reserved for rich cards. MUST be omitted/ignored in Sprint 9.1.
          x-gmrlog-status: future

        parentMessageId:

          type: string

          format: uuid

          x-gmrlog-status: future

        clientMessageId:

          type: string

          format: uuid

          description: Client idempotency token (optional if Idempotency-Key header set).

      example:

        body: "Hey — want to co-op tonight?"

        messageType: TEXT

    UpdateMessageRequest:

      type: object

      required: [body]

      properties:

        body:

          type: string

          minLength: 1

          maxLength: 8000

    MarkMessagesReadRequest:

      type: object

      properties:

        upToMessageId:

          type: string

          format: uuid

        messageIds:

          type: array

          items:

            type: string

            format: uuid

    MessageReaction:

      type: object

      required: [id, messageId, userId, emoji, createdAt]

      properties:

        id:

          type: string

          format: uuid

        messageId:

          type: string

          format: uuid

        userId:

          type: string

          format: uuid

        emoji:

          type: string

          minLength: 1

          maxLength: 32

        createdAt:

          type: string

          format: date-time

    MessageReactionPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/MessageReaction'

    CreateMessageReactionRequest:

      type: object

      required: [emoji]

      properties:

        emoji:

          type: string

          minLength: 1

          maxLength: 32

    PinnedMessage:

      type: object

      required: [messageId, pinnedAt, pinnedBy]

      properties:

        messageId:

          type: string

          format: uuid

        message:

          $ref: '#/components/schemas/Message'

        pinnedAt:

          type: string

          format: date-time

        pinnedBy:

          type: string

          format: uuid

      x-gmrlog-status: future

    PinnedMessagePage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/PinnedMessage'

      x-gmrlog-status: future

    ReportMessageRequest:

      type: object

      required: [reasonId]

      properties:

        reasonId:

          type: string

          format: uuid

        description:

          type: string

          maxLength: 2000

    MessageReportReceipt:

      type: object

      required: [reportId, createdAt]

      properties:

        reportId:

          type: string

          format: uuid

        createdAt:

          type: string

          format: date-time

    Mention:

      type: object

      required: [id, messageId, mentionedUserId, createdAt]

      properties:

        id:

          type: string

          format: uuid

        messageId:

          type: string

          format: uuid

        conversationId:

          type: string

          format: uuid

        mentionedUserId:

          type: string

          format: uuid

        createdAt:

          type: string

          format: date-time

    MentionPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/Mention'

    ForwardMessageRequest:

      type: object

      required: [targetConversationId]

      properties:

        targetConversationId:

          type: string

          format: uuid

        note:

          type: string

          maxLength: 500

      x-gmrlog-status: future

    Poll:

      type: object

      required: [id, conversationId, question, options, createdAt]

      properties:

        id:

          type: string

          format: uuid

        conversationId:

          type: string

          format: uuid

        messageId:

          type: string

          format: uuid

          nullable: true

        question:

          type: string

          maxLength: 500

        options:

          type: array

          minItems: 2

          maxItems: 10

          items:

            $ref: '#/components/schemas/PollOption'

        endsAt:

          type: string

          format: date-time

          nullable: true

        createdAt:

          type: string

          format: date-time

      x-gmrlog-status: future

    PollOption:

      type: object

      required: [id, label, voteCount]

      properties:

        id:

          type: string

          format: uuid

        label:

          type: string

          maxLength: 200

        voteCount:

          type: integer

          minimum: 0

      x-gmrlog-status: future

    CreatePollRequest:

      type: object

      required: [question, options]

      properties:

        question:

          type: string

          minLength: 1

          maxLength: 500

        options:

          type: array

          minItems: 2

          maxItems: 10

          items:

            type: string

            minLength: 1

            maxLength: 200

        endsAt:

          type: string

          format: date-time

      x-gmrlog-status: future

    CastPollVoteRequest:

      type: object

      required: [optionId]

      properties:

        optionId:

          type: string

          format: uuid

      x-gmrlog-status: future

    Group:

      type: object

      required: [id, name, visibility, createdAt, updatedAt]

      properties:

        id:

          type: string

          format: uuid

        name:

          type: string

          maxLength: 80

        slug:

          type: string

          maxLength: 80

        description:

          type: string

          maxLength: 2000

          nullable: true

        rules:

          type: string

          maxLength: 8000

          nullable: true

        visibility:

          $ref: '#/components/schemas/GroupVisibility'

        avatarUrl:

          type: string

          format: uri

          nullable: true

        bannerUrl:

          type: string

          format: uri

          nullable: true

        tags:

          type: array

          items:

            type: string

          maxItems: 20

        memberCount:

          type: integer

          minimum: 0

        createdAt:

          type: string

          format: date-time

        updatedAt:

          type: string

          format: date-time

      x-gmrlog-status: future

    GroupPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

                $ref: '#/components/schemas/Group'

