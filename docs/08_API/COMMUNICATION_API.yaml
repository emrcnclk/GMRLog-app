openapi: 3.1.0

info:

  title: GMRLOG Communication API

  version: 1.0.0

  description: |
    Production OpenAPI contract for the GMRLOG **Communication Platform**.

    **Communication Platform Freeze v1.0** (Sprint 9.0.1). Normative decisions:
    leave ≠ delete, GroupMember→ConversationMember ownership, O(N) cache ban,
    DM block privacy (404), Sprint 9.1 scope lock. See
    `docs/00_PROJECT/COMMUNICATION_PLATFORM_FREEZE_v1.md`.

    This module is the canonical REST owner for conversations, messages, groups,
    channels, reactions, threads, polls, mentions, pins and related engagement.

    It is **not** a narrow "DM-only Messaging" feature — it is the shared
    communication bounded context that future WebSocket, Notification, Feed,
    Search, AI, Community and Indie Hub integrations will consume via events.

    ## Sprint 9.1 normative slice (implement ONLY these)

    Operations tagged `x-gmrlog-sprint: '9.1'` and **not** `x-gmrlog-status: future`:
    list/create/get/patch conversations, leave conversation, list participants,
    list/create/get messages. Create message accepts **TEXT** only (SYSTEM is
    server-emitted). All other paths are non-normative appendix until their sprint.

    ## Implementation status

    OpenAPI-first SSOT. Backend implementation lands in Sprint 9.1+.
    Extensions marked `x-gmrlog-status: future` require Database Freeze
    follow-ups before shipping.

    ## Database Freeze alignment

    Present today: `Conversation`, `ConversationMember`, `Message`,
    `MessageRead`, `MessageAttachment`, `TypingStatus`.

    Future schema (documented here, not yet in DB Freeze): Groups, Channels,
    Threads (`parentMessageId`), Pins, Polls, Voice rooms, Forward graph.

    ## Realtime

    WebSocket / typing / presence / delivery ACKs are **out of this REST file**.
    See `docs/06_BACKEND/WEBSOCKET_ARCHITECTURE.md` and Sprint 9.4–9.5.

servers:

  - url: https://api.gmrlog.com/api/v1

    description: Production

  - url: https://staging-api.gmrlog.com/api/v1

    description: Staging

  - url: http://localhost:4000/api/v1

    description: Local Development

tags:

  - name: Conversations
    description: Direct and group-backed conversation inbox

  - name: Participants
    description: Conversation membership

  - name: Messages
    description: Message CRUD, rich types, search

  - name: ReadReceipts
    description: Message read state (Freeze MessageRead)

  - name: Reactions
    description: Likes and emoji reactions

  - name: Threads
    description: Reply threads (future Freeze column)

  - name: Groups
    description: Public / private / invite-only communities

  - name: GroupMembers
    description: Owner / moderator / member roles

  - name: Channels
    description: Topic channels under a group

  - name: Polls
    description: In-conversation polls

  - name: Mentions
    description: Mention inbox and per-message mentions

  - name: Pins
    description: Pinned messages

  - name: Bookmarks
    description: Saved messages

  - name: Attachments
    description: Media attachments (API surface future)

  - name: VoiceRooms
    description: Voice channels (future)

security:

  - BearerAuth: []

paths:

  /conversations:

    get:

      tags:
        - Conversations

      summary: List conversations

      operationId: listConversations

      description: |
        Inbox for the authenticated user (participant only).

      x-rate-limit: 180/min

      x-gmrlog-sprint: '9.1'

      parameters:

        - $ref: './common/parameters.yaml#/components/parameters/Cursor'

        - $ref: './common/parameters.yaml#/components/parameters/Limit'

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ConversationPage'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

    post:

      tags:
        - Conversations

      summary: Create conversation

      operationId: createConversation

      description: |
        Creates a DIRECT conversation (or resolves existing DM pair). Group chats are created via Groups/Channels (9.3).
        
        Privacy: if either party has a Social block (either direction), respond **404** (same as non-participant private resource) — never 403 that reveals a block. Friend-gate is out of scope for 9.1; rate limits are the primary spam control.

      x-rate-limit: 30/min

      x-gmrlog-sprint: '9.1'

      x-idempotent: true

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/CreateConversationRequest'

      responses:

        "201":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Conversation'

        "400":

          $ref: './common/responses.yaml#/components/responses/ValidationError'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
  /conversations/{conversationId}:

    get:

      tags:
        - Conversations

      summary: Get conversation

      operationId: getConversation

      x-rate-limit: 180/min

      x-gmrlog-sprint: '9.1'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Conversation'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

    patch:

      tags:
        - Conversations

      summary: Update conversation

      operationId: updateConversation

      description: |
        Participant may update title/archive flags where permitted.

      x-rate-limit: 60/min

      x-gmrlog-sprint: '9.1'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/UpdateConversationRequest'

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Conversation'

        "400":

          $ref: './common/responses.yaml#/components/responses/ValidationError'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

    delete:

      tags:
        - Conversations

      summary: Leave conversation

      operationId: leaveConversation

      description: |
        **Leave only** — never destroys the Conversation aggregate or messages.
        
        Sets `ConversationMember.leftAt` for the caller. Emits `conversation.participant.left.v1` (not `conversation.deleted.v1`).
        
        Archive/mute are **PATCH** (`archived` / `muted`). Hard-delete of a conversation is out of scope for 9.1–9.6 (no public destroy endpoint).

      x-rate-limit: 60/min

      x-gmrlog-sprint: '9.1'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

      responses:

        "204":

          description: Left (ConversationMember.leftAt set)

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
  /conversations/{conversationId}/participants:

    get:

      tags:
        - Participants

      summary: List participants

      operationId: listConversationParticipants

      x-gmrlog-sprint: '9.1'

      parameters:

