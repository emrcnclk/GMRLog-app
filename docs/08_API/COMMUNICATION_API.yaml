        - $ref: './common/parameters.yaml#/components/parameters/Cursor'

        - $ref: './common/parameters.yaml#/components/parameters/Limit'

      responses:

        "200":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ConversationParticipantPage'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

    post:

      tags:
        - Participants

      summary: Add participant

      operationId: addConversationParticipant

      description: |
        Group-backed conversations only. DIRECT is fixed at two members.

      x-rate-limit: 30/min

      x-gmrlog-status: future

      x-gmrlog-sprint: '9.3'

      parameters:

        - $ref: '#/components/parameters/ConversationId'

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AddParticipantRequest'

      responses:

        "201":

          description: OK

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ConversationParticipant'

        "400":

          $ref: './common/responses.yaml#/components/responses/ValidationError'

        "401":

          $ref: './common/responses.yaml#/components/responses/Unauthorized'

        "403":

          $ref: './common/responses.yaml#/components/responses/Forbidden'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'


  ################################################################################
  /conversations/{conversationId}/participants/{userId}:

    delete:

      tags:
        - Participants

      summary: Remove participant

      operationId: removeConversationParticipant

      x-gmrlog-status: future

      x-gmrlog-sprint: '9.3'

