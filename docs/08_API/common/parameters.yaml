components:

  parameters:

    Page:

      name: page

      in: query

      required: false

      deprecated: true

      description: Deprecated — use Cursor + Limit. Page number (offset pagination).

      schema:

        type: integer

        minimum: 1

        default: 1

    PageSize:

      name: pageSize

      in: query

      required: false

      deprecated: true

      description: Deprecated — use Limit. Number of items per page.

      schema:

        type: integer

        minimum: 1

        maximum: 100

        default: 20

    Cursor:

      name: cursor

      in: query

      required: false

      description: Cursor for cursor-based pagination

      schema:

        type: string

    Limit:

      name: limit

      in: query

      required: false

      description: Maximum number of items to return

      schema:

        type: integer

        minimum: 1

        maximum: 100

        default: 20
