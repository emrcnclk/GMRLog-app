openapi: 3.1.0

info:
  title: GMRLOG Game API
  version: 1.0.0
  description: |
    Game catalog API powering the GMRLOG platform.

    Owns game metadata, platforms, genres, companies, releases, ratings,
    media, achievements, DLC and catalog collections (IGDB).

    Search lives in SEARCH_API. Recommendations and similar games live in AI_API.

servers:
  - url: https://api.gmrlog.com/api/v1
    description: Production

  - url: https://staging-api.gmrlog.com/api/v1
    description: Staging

  - url: http://localhost:4000/api/v1
    description: Local

tags:
  - name: Games
    description: Game catalog endpoints

  - name: Discover
    description: Discovery and trending

  - name: Releases
    description: Release information

  - name: Media
    description: Screenshots, videos and artwork

  - name: Companies
    description: Developers and publishers

  - name: Ratings
    description: Scores and ratings

  - name: Achievements
    description: Achievements and trophies

security:
  - BearerAuth: []

paths:

  ################################################################################
  # Game Details
  ################################################################################

  /games/{gameId}:

    get:

      tags:
        - Games

      summary: Get game details

      operationId: getGame

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Game details

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/Game'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  ################################################################################
  # D3.25 Catalog Metadata (docs/18_CATALOG/) — additive
  # /games/{gameId}/media already existed below under "Media Hub" as an
  # unimplemented stub; it is reconciled there to match the real D3.25
  # implementation rather than duplicated here.
  ################################################################################

  /games/{gameId}/similar:

    get:

      tags:
        - Games

      summary: Provider-declared similar games

      description: |
        Entries not yet present in the catalog return `gameId: null` with the
        provider's title, so the relationship is visible before the target
        game exists.

      operationId: listGameSimilar

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Provider-declared related games

          content:

            application/json:

              schema:

                type: array

                items:

                  $ref: '#/components/schemas/GameRelatedGame'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/metadata:

    get:

      tags:
        - Games

      summary: Catalog enrichment status and attribution

      description: Read-only. Does not trigger enrichment.

      operationId: getGameMetadataStatus

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Enrichment lifecycle status

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/GameMetadataStatus'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  ################################################################################
  # D3.24 Game Hub
  ################################################################################

  /games/{gameId}/hub:

    get:

      tags:
        - Games

      summary: Game Hub summary and tab counts

      operationId: getGameHub

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Hub summary

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/GameHub'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/feed:

    get:

      tags:
        - Games

      summary: Game Hub hybrid timeline

      operationId: getGameHubFeed

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

        - $ref: './common/parameters.yaml#/components/parameters/Cursor'

        - $ref: './common/parameters.yaml#/components/parameters/Limit'

      responses:

        "200":

          description: Game-scoped feed

          content:

            application/json:

              schema:

                $ref: './SOCIAL_API.yaml#/components/schemas/FeedPage'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/guides:

    get:

      tags:
        - Games

      summary: Guide posts for a game

      operationId: listGameGuides

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Guide posts

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/collections:

    get:

      tags:
        - Games

      summary: Collections containing the game

      operationId: listGameCollections

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Collections

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/tier-lists:

    get:

      tags:
        - Games

      summary: Tier lists containing the game

      operationId: listGameTierLists

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Tier lists

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/communities:

    get:

      tags:
        - Games

      summary: Communities tagged for the game

      operationId: listGameCommunities

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Communities

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  /games/{gameId}/players:

    get:

      tags:
        - Games

      summary: Public players with the game in library

      operationId: listGamePlayers

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Players

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

  ################################################################################
