  ################################################################################
  # Media Hub — implemented D3.25 (docs/18_CATALOG/MEDIA_INGESTION.md).
  # Reconciled from a pre-D3.25 stub that returned an unimplemented
  # `GameMedia` package object; the real implementation returns a flat,
  # ordered list of mirrored assets.
  ################################################################################

  /games/{gameId}/media:

    get:

      tags:
        - Media

      summary: Mirrored catalog artwork for a game

      description: |
        Serves persisted media only. Never waits on a metadata provider —
        see docs/18_CATALOG/GAME_METADATA_ARCHITECTURE.md §5.

      operationId: listGameMedia

      security: []

      parameters:

        - $ref: '#/components/parameters/GameId'

      responses:

        "200":

          description: Mirrored media, ordered by kind then sortOrder

          content:

            application/json:

              schema:

                type: array

                items:

                  $ref: '#/components/schemas/GameMediaItem'

        "404":

          $ref: './common/responses.yaml#/components/responses/NotFound'

