components:

  securitySchemes:

    BearerAuth:

      $ref: './common/security.yaml#/components/securitySchemes/BearerAuth'

  parameters:

    GameId:

      name: gameId

      in: path

      required: true

      schema:

        type: string

        format: uuid

    PlatformId:

      name: platformId

      in: path

      required: true

      schema:

        type: integer

    GenreId:

      name: genreId

      in: path

      required: true

      schema:

        type: integer

    FranchiseId:

      name: franchiseId

      in: path

      required: true

      schema:

        type: integer

  schemas:

    GameHub:

      type: object

      required: [gameId, title, tabCounts]

      properties:

        gameId:

          type: string

        title:

          type: string

        tabCounts:

          type: object

          required:
            - reviews
            - screenshots
            - guides
            - collections
            - tierLists
            - events
            - communities
            - players

          properties:

            reviews: { type: integer }
            screenshots: { type: integer }
            guides: { type: integer }
            collections: { type: integer }
            tierLists: { type: integer }
            events: { type: integer }
            communities: { type: integer }
            players: { type: integer }

    Game:

      allOf:

        - $ref: './common/schemas/game-summary.yaml#/components/schemas/GameSummary'

        - type: object

          properties:

            description:

              type: string

            storyline:

              type: string

            releaseStatus:

              type: string

            igdbId:

              type: integer

            metacriticScore:

              type: integer

            opencriticScore:

              type: integer

            hltbMain:

              type: integer

            hltbCompletionist:

              type: integer

            # D3.25 — additive catalog metadata (docs/18_CATALOG/GAME_METADATA_ARCHITECTURE.md).
            # `description`/`igdbId` above predate D3.25 as unimplemented aspiration;
            # both are now real. `storyline`/`releaseStatus`/`metacriticScore`/
            # `opencriticScore`/`hltbMain`/`hltbCompletionist` remain unimplemented —
            # out of D3.25 scope, left for the doc-truth pass (audit Sprint 1).

            heroUrl:

              type: string

              nullable: true

            summary:

              type: string

              nullable: true

            trailerUrl:

              type: string

              nullable: true

            externalRating:

              type: number

              nullable: true

            externalRatingCount:

              type: integer

              nullable: true

            steamAppId:

              type: integer

              nullable: true

            rawgId:

              type: integer

              nullable: true

            tags:

              type: array

              items:

                $ref: '#/components/schemas/GameTag'

            developers:

              type: array

              items:

                $ref: '#/components/schemas/CompanyRef'

            publishers:

              type: array

              items:

                $ref: '#/components/schemas/CompanyRef'

            franchise:

              $ref: '#/components/schemas/NamedRef'

              nullable: true

            series:

              $ref: '#/components/schemas/NamedRef'

              nullable: true

            screenshots:

              type: array

              items:

                $ref: '#/components/schemas/GameMediaItem'

            metadata:

              $ref: '#/components/schemas/GameMetadataStatus'

    NamedRef:

      type: object

      required:
        - id
        - name
        - slug

      properties:

        id:

          type: string

        name:

          type: string

        slug:

          type: string

    GameTag:

      allOf:

        - $ref: '#/components/schemas/NamedRef'

        - type: object

          properties:

            kind:

              type: string

              enum: [theme, mode, perspective, keyword]

    CompanyRef:

      $ref: '#/components/schemas/NamedRef'

    GameMediaItem:

      type: object

      required:
        - id
        - kind

      properties:

        id:

          type: string

        kind:

          type: string

          enum: [screenshot, cover, banner, video, hero, artwork, logo, trailer]

        url:

          type: string

          nullable: true

        width:

          type: integer

          nullable: true

        height:

          type: integer

          nullable: true

        sortOrder:

          type: integer

    GameRelatedGame:

      type: object

      required:
        - kind

      properties:

        gameId:

          type: string

          nullable: true

        title:

          type: string

          nullable: true

        slug:

          type: string

          nullable: true

        coverImageUrl:

          type: string

          nullable: true

        kind:

          type: string

          enum: [similar, dlc, expansion, remake, remaster, prequel, sequel]

    GameMetadataStatus:

      type: object

      required:
        - status

      properties:

        status:

          type: string

          enum: [pending, enriching, complete, partial, failed, stale]

        provider:

          type: string

          nullable: true

          enum: [igdb, steam, rawg, manual, null]

        refreshedAt:

          type: string

          format: date-time

          nullable: true

        attribution:

          type: string

          nullable: true

    GameSearchPage:

      allOf:

        - $ref: './common/schemas/cursor-page.yaml#/components/schemas/CursorPage'

        - type: object

          properties:

            items:

              type: array

              items:

